services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - agent-service

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8002:8002"
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8002"

  rag-service:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./rag-service:/app
    ports:
      - "8001:8001"
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8001"

  agent-service:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./agent-service:/app
    ports:
      - "8003:8003"
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8003"
    depends_on:
      - backend
      - rag-service